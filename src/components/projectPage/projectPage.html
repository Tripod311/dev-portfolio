<div class="mx-auto w-full max-w-5xl">
	<header class="mb-10 border-b border-zinc-800 pb-10 md:mb-14 md:pb-14">
		<a
			href="/"
			class="
				mb-10 inline-flex items-center gap-2
				text-sm font-medium text-zinc-400
				transition hover:text-blue-400
				focus:outline-none focus:ring-2 focus:ring-blue-400
			"
		>
			<span aria-hidden="true">←</span>
			All projects
		</a>

		<p
			class="
				mb-4 text-sm font-semibold uppercase tracking-widest
				text-blue-400
			"
		>
			Project
		</p>

		<h1
			class="
				mb-5 max-w-4xl text-4xl font-semibold leading-none
				tracking-[-0.045em] text-zinc-100
				sm:text-5xl lg:text-7xl
			"
			data-text="title"
		>
		</h1>

		<p
			class="
				max-w-3xl text-base leading-relaxed text-zinc-400
				sm:text-lg
			"
			data-text="description"
		>
		</p>

		<ul
			class="mt-7 flex list-none flex-wrap gap-2 p-0"
			aria-label="Technologies"
			data-text="tags"
		>
		</ul>
	</header>

	<main>
		<article
			data-ref="content"
			class="max-w-none
				prose prose-zinc prose-invert

				prose-headings:text-zinc-100
				prose-p:text-zinc-300
				prose-li:text-zinc-300
				prose-strong:text-zinc-100

				prose-a:text-blue-400
				prose-a:no-underline
				prose-a:hover:text-blue-300

				prose-code:text-blue-300
				prose-pre:border
				prose-pre:border-zinc-800
				prose-pre:bg-zinc-950

				prose-blockquote:text-zinc-400
				prose-hr:border-zinc-800
			"
		></article>
	</main>
</div>
