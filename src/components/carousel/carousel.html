<section
	data-carousel
	class="
		not-prose
		relative my-8 w-full
		overflow-hidden
		rounded-2xl
		border border-zinc-700
		bg-zinc-950
		shadow-xl shadow-black/20
		ring-1 ring-white/5
	"
	aria-label="Project screenshots"
>
	<div
		data-ref="viewport"
		class="h-full w-full overflow-hidden"
	>
		<div
			data-ref="track"
			class="
				flex h-full
				transition-transform duration-300 ease-out
			"
		>
			<!--slot:images-->
		</div>
	</div>

	<button
		data-ref="previous"
		type="button"
		aria-label="Previous image"
		class="
			absolute left-3 top-1/2
			flex h-11 w-11
			-translate-y-1/2
			items-center justify-center
			rounded-full
			border-2 border-white/50
			bg-black/70
			text-2xl text-white
			shadow-lg shadow-black/50
			ring-1 ring-black/70
			backdrop-blur
			transition
			hover:border-white/80
			hover:bg-black/90
			focus:outline-none
			focus:ring-2 focus:ring-blue-400
			sm:right-6
		"
	>
		<span aria-hidden="true">‹</span>
	</button>

	<button
		data-ref="next"
		type="button"
		aria-label="Next image"
		class="
			absolute right-3 top-1/2
			flex h-11 w-11
			-translate-y-1/2
			items-center justify-center
			rounded-full
			border-2 border-white/50
			bg-black/70
			text-2xl text-white
			shadow-lg shadow-black/50
			ring-1 ring-black/70
			backdrop-blur
			transition
			hover:border-white/80
			hover:bg-black/90
			focus:outline-none
			focus:ring-2 focus:ring-blue-400
			sm:right-6
		"
	>
		<span aria-hidden="true">›</span>
	</button>

	<div
		data-ref="counter"
		aria-live="polite"
		class="
			absolute bottom-5 left-1/2
			-translate-x-1/2
			rounded-full
			border border-white/10
			bg-black/50
			px-3 py-1.5
			text-xs font-medium text-zinc-200
			backdrop-blur
		"
	>
	</div>
</section>
